<title>词义三选一</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 设计：冷调纸色 + 松烟绿，宋体做词头，无衬线做释义；一屏只做一件事。 */
  :root{
    --bg:#EEF0E9;
    --surface:#FBFBF6;
    --surface-2:#F3F4EC;
    --ink:#191D1A;
    --muted:#66706A;
    --line:#D7DCD1;
    --accent:#2E5E4C;
    --accent-soft:#E1EAE2;
    --on-accent:#F7FAF3;
    --correct:#2B7050;
    --correct-soft:#E3EFE6;
    --wrong:#A6442C;
    --wrong-soft:#F6E7E1;
    --near:#8A682C;
    --near-soft:#F3ECDA;
    --shadow:0 1px 2px rgba(25,29,26,.05), 0 10px 26px rgba(25,29,26,.05);
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101412;
      --surface:#171D19;
      --surface-2:#1D2420;
      --ink:#E6EAE2;
      --muted:#93A095;
      --line:#2B352E;
      --accent:#8AC5A7;
      --accent-soft:#1E2C25;
      --on-accent:#0F1A14;
      --correct:#7FC7A4;
      --correct-soft:#1B2A22;
      --wrong:#E08E76;
      --wrong-soft:#2A1D18;
      --near:#D2B071;
      --near-soft:#2A2419;
      --shadow:none;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101412;
    --surface:#171D19;
    --surface-2:#1D2420;
    --ink:#E6EAE2;
    --muted:#93A095;
    --line:#2B352E;
    --accent:#8AC5A7;
    --accent-soft:#1E2C25;
    --on-accent:#0F1A14;
    --correct:#7FC7A4;
    --correct-soft:#1B2A22;
    --wrong:#E08E76;
    --wrong-soft:#2A1D18;
    --near:#D2B071;
    --near-soft:#2A2419;
    --shadow:none;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.6;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:20px 36px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #app{max-width:760px;margin:0 auto}

  /* ---------- 首页 ---------- */
  .home-head{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-block:14px 22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:14px}
  .seal{
    width:50px;height:50px;flex:none;display:grid;place-items:center;
    border:1.5px solid var(--accent);border-radius:5px;
    color:var(--accent);font-family:var(--serif);font-size:27px;font-weight:600;
    transform:rotate(-3deg);
  }
  h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,5vw,2.5rem);letter-spacing:.1em}
  .lede{margin:0;max-width:34em;color:var(--muted);font-size:1rem;line-height:1.75}
  .lede b{color:var(--ink);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .stat{display:flex;flex-direction:column;gap:2px;padding-block:16px 14px;border-right:1px solid var(--line)}
  .stat:first-child{padding-left:2px}
  .stat:last-child{border-right:0;padding-left:16px}
  .stat:nth-child(2){padding-left:16px}
  .num{font-family:var(--serif);font-size:1.65rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .unit{font-size:.8rem;color:var(--muted);letter-spacing:.08em}

  .panel{margin-top:24px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:20px 22px;display:grid;gap:18px;box-shadow:var(--shadow)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;min-width:0}
  .flabel{font-size:.85rem;color:var(--muted);letter-spacing:.12em}
  .seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);min-width:0}
  .seg button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:7px 15px;font-size:.92rem;line-height:1.2;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}

  .primary{
    display:block;width:100%;margin-top:22px;padding:17px 20px;border:0;border-radius:15px;
    background:var(--accent);color:var(--on-accent);font-size:1.08rem;font-weight:600;letter-spacing:.06em;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .12s ease, filter .15s ease;
  }
  .primary:active{transform:scale(.994);filter:brightness(.97)}
  .ghost{
    display:block;width:100%;margin-top:10px;padding:15px 20px;border:1px solid var(--line);border-radius:15px;
    background:transparent;color:var(--ink);font-size:1rem;cursor:pointer;transition:border-color .15s ease;
  }
  .ghost:active{transform:scale(.994)}
  @media (hover:hover){.ghost:hover{border-color:var(--accent)}}

  .how{margin-top:30px;display:grid;gap:9px}
  .how p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.7}
  .how-k{display:inline-block;width:5.4em;color:var(--ink);font-size:.8rem;font-weight:600;letter-spacing:.08em}

  .foot{margin-top:22px;color:var(--muted);font-size:.8rem;line-height:1.8;text-align:center}
  .foot span{font-variant-numeric:tabular-nums}


  /* ---------- 答题 ---------- */
  .quiz-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding-block:4px 18px}
  .back{
    width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
    display:grid;place-items:center;font-size:1.1rem;color:var(--muted);cursor:pointer;line-height:1;
  }
  .track{height:3px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
  .counter{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}

  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4.5vw,38px);box-shadow:var(--shadow)}
  .qmeta{display:flex;justify-content:center}
  .chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.76rem;letter-spacing:.14em}
  .word{margin-top:14px;text-align:center;font-family:var(--serif);font-weight:600;font-size:clamp(3rem,9vw,4.7rem);line-height:1.16;letter-spacing:.06em}
  .pinyin{margin-top:4px;text-align:center;color:var(--muted);font-size:.95rem;letter-spacing:.22em;font-variant-numeric:tabular-nums}
  .read-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .read-label{font-size:.76rem;color:var(--muted);letter-spacing:.12em}
  .read-btn{min-height:34px;padding:5px 13px;border:1px solid transparent;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .read-btn:active{background:var(--accent);color:var(--on-accent)}
  .read-note{font-size:.74rem;color:var(--muted)}
  .prompt{margin:18px 0 0;text-align:center;color:var(--muted);font-size:.92rem;letter-spacing:.04em}

  .options{display:grid;gap:11px;margin-top:22px}
  .opt{
    display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
    font-size:1.03rem;line-height:1.6;cursor:pointer;
    transition:border-color .16s ease, background .16s ease, opacity .16s ease, transform .1s ease;
  }
  .opt:active{transform:scale(.996)}
  @media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
  .opt:disabled{cursor:default}
  .tag{
    flex:none;width:29px;height:29px;margin-top:1px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
    color:var(--muted);font-family:var(--serif);font-size:.92rem;
  }
  .opt-body{flex:1;min-width:0}
  .src{display:block;margin-top:5px;color:var(--muted);font-size:.78rem;letter-spacing:.04em}
  .opt.correct{border-color:var(--correct);background:var(--correct-soft)}
  .opt.correct .tag{border-color:var(--correct);color:var(--correct);background:transparent}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.wrong .tag{border-color:var(--wrong);color:var(--wrong);background:transparent}
  .opt.dim{opacity:.48}

  .explain{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);display:grid;gap:15px}
  .ex-head{font-size:.8rem;letter-spacing:.16em;color:var(--muted)}
  .exrow{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:start}
  .exlabel{font-size:.76rem;letter-spacing:.1em;color:var(--muted);padding-top:3px}
  .exrow.c .exlabel{color:var(--correct)}
  .exrow.n .exlabel{color:var(--near)}
  .exrow.o .exlabel{color:var(--wrong)}
  .exrow strong{font-family:var(--serif);font-weight:600;font-size:1.12rem;letter-spacing:.04em}
  .exrow p{margin:1px 0 0;color:var(--muted);font-size:.93rem;line-height:1.65}
  .exrow p.note{color:var(--near);font-size:.86rem;margin-top:5px}

  #nextBtn{margin-top:20px}

  /* ---------- 结果 ---------- */
  .eyebrow{margin:6px 0 0;font-size:.8rem;letter-spacing:.18em;color:var(--muted);text-align:center}
  .score{font-family:var(--serif);font-size:clamp(3.2rem,11vw,4.8rem);line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:.02em}
  .rmsg{text-align:center;color:var(--muted);margin:6px 0 0;font-size:.98rem}
  .bar{height:4px;background:var(--line);border-radius:999px;margin:22px 0 8px;overflow:hidden}
  .bar-fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s ease}
  .rpct{margin:0;text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .section-label{margin:28px 0 10px;font-size:.8rem;letter-spacing:.16em;color:var(--muted)}
  .wlist{display:grid;gap:10px}
  .wrow{border:1px solid var(--line);border-radius:13px;padding:13px 16px;background:var(--surface)}
  .wrow strong{font-family:var(--serif);font-weight:600;font-size:1.08rem;letter-spacing:.04em}
  .wrow p{margin:2px 0 0;color:var(--muted);font-size:.9rem;line-height:1.6}
  .allright{margin:26px 0 0;text-align:center;color:var(--correct);font-size:.98rem}
  .actions{display:grid;gap:10px;margin-top:28px}
  .actions .primary{margin-top:0}

  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .qcard.enter{animation:rise .3s ease both}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:420px){
    .field{flex-direction:column;align-items:flex-start;gap:8px}
    .seg{width:100%;justify-content:space-between}
    .seg button{flex:1;padding-inline:8px}
    .exrow{grid-template-columns:40px 1fr}
    .stat:nth-child(2),.stat:last-child{padding-left:12px}
  }
</style>

<div id="app">

  <!-- 首页 -->
  <section class="screen" id="home">
    <header class="home-head">
      <div class="brand">
        <div class="seal" aria-hidden="true">义</div>
        <h1>词义三选一</h1>
      </div>
      <p class="lede">看一个词，选出<b>最准确的意思</b>。三个选项里只有一个是对的，选完就能看到各自的释义。</p>
    </header>

    <div class="stats" id="homeStats" hidden>
      <div class="stat"><span class="num" id="stAnswered">0</span><span class="unit">累计题数</span></div>
      <div class="stat"><span class="num" id="stRate">0%</span><span class="unit">正确率</span></div>
      <div class="stat"><span class="num" id="stWrong">0</span><span class="unit">待复习</span></div>
    </div>

    <div class="panel">
      <div class="field">
        <span class="flabel">范围</span>
        <div class="seg" id="modeSeg" role="group" aria-label="范围">
          <button type="button" data-value="all">全部</button>
          <button type="button" data-value="word">词语</button>
          <button type="button" data-value="idiom">成语</button>
          <button type="button" data-value="phrase">短语</button>
        </div>
      </div>
      <div class="field">
        <span class="flabel">题量</span>
        <div class="seg" id="lenSeg" role="group" aria-label="题量">
          <button type="button" data-value="10">10 题</button>
          <button type="button" data-value="20">20 题</button>
          <button type="button" data-value="30">30 题</button>
          <button type="button" data-value="all">全部</button>
        </div>
      </div>
    </div>

    <button class="primary" id="startBtn" type="button">开始练习</button>
    <button class="ghost" id="wrongBtn" type="button" hidden>复习错题</button>

    <div class="how">
      <p><span class="how-k">三个选项</span>顺序打乱，只有一个是对的；选完列出各自的释义。</p>
      <p><span class="how-k">答完就看</span>正确项变绿，下面列出三个选项的释义。</p>
      <p><span class="how-k">错题本</span>选错的词自动收进来，可以单独复习。</p>
    </div>

    <p class="foot">题库 <span id="bankCount">0</span> 题，<span id="bankBreak">词语 0 · 成语 0 · 短语 0</span><br>只收常用词语、成语和短语，不收网络流行语、生造词和人名</p>
  </section>

  <!-- 答题 -->
  <section class="screen" id="quiz" hidden>
    <div class="quiz-top">
      <button class="back" id="quitBtn" type="button" aria-label="退出练习">←</button>
      <div class="track" aria-hidden="true"><div class="fill" id="progFill"></div></div>
      <span class="counter" id="counter">1 / 10</span>
    </div>

    <div class="qcard" id="qcard">
      <div class="qmeta"><span class="chip" id="qType">词语</span></div>
      <div class="word" id="qWord">果断</div>
      <div class="pinyin" id="qPinyin">guǒ duàn</div>
      <div class="read-row">
        <span class="read-label">读音</span>
        <button class="read-btn" id="readBtn" type="button">读一遍</button>
        <span class="read-note" id="voiceNote">正在加载语音…</span>
      </div>
      <p class="prompt">下面哪一个是它最准确的意思？</p>
      <div class="options" id="options"></div>
      <div class="explain" id="explain" hidden aria-live="polite"></div>
      <button class="primary" id="nextBtn" type="button" hidden>下一题</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="result" hidden>
    <p class="eyebrow">本轮结束</p>
    <div class="score" id="rScore">0 / 10</div>
    <p class="rmsg" id="rMsg"></p>
    <div class="bar" aria-hidden="true"><div class="bar-fill" id="rBar"></div></div>
    <p class="rpct" id="rPct">正确率 0%</p>

    <div id="rWrongWrap" hidden>
      <p class="section-label">这一轮没选对的</p>
      <div class="wlist" id="rWrongList"></div>
    </div>
    <p class="allright" id="rAllRight" hidden>这一组全部答对。</p>

    <div class="actions">
      <button class="primary" id="rAgainBtn" type="button">再来一组</button>
      <button class="ghost" id="rReviewBtn" type="button" hidden>复习错题</button>
      <button class="ghost" id="rHomeBtn" type="button">回到首页</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* 数据格式：[词, 拼音, 本义, 近义词, 近义释义, 反义词, 反义释义, 类型(1词语/2成语), 辨析] */
  var DATA = [

    /* ===== 情绪与心理 ===== */
    ["喜悦","xǐ yuè","因事情合自己的心意而心里高兴","兴奋","情绪高涨，激动得坐不住","悲伤","心里难过、痛苦",1,"兴奋是激动得静不下来，喜悦是事情顺心带来的高兴。"],
    ["愤怒","fèn nù","因受到冒犯或强烈不满而生气","怨恨","心里记着别人的过错，长期带着恨意","平静","情绪安定，没有波动",1,"愤怒是一时发作的火气，怨恨是长久放不下的恨。"],
    ["焦虑","jiāo lǜ","事情还没有结果，心里一直不安、放不下","紧张","当下心里绷得很紧，怕出错","镇定","遇到情况不慌，心里稳得住",1,"紧张多指眼前的场合，焦虑多指对将来的担心。"],
    ["沮丧","jǔ sàng","受到挫折后情绪低落，提不起劲","失望","期望落空，觉得事情不如所愿","振奋","情绪高涨，精神振作起来",1,"失望是对某件事的结果，沮丧是整个人都蔫了下去。"],
    ["羞愧","xiū kuì","因自己做错事或不如别人而觉得难为情","尴尬","处境为难，不知道怎么办才好","自豪","因自己或自己一方有成绩而感到光荣",1,"尴尬是场面下不来，羞愧是心里觉得自己不对。"],
    ["惊讶","jīng yà","事情出乎意料，感到意外","好奇","对不了解的事物有兴趣，想弄明白","淡然","把事情看得很淡，心里不起波澜",1,"好奇是想弄清楚，惊讶是被没想到的事怔住。"],
    ["恐惧","kǒng jù","面对危险时心里极度害怕","担忧","心里放不下，怕事情出问题","勇敢","不怕危险和困难，敢往前走",1,"担忧是怕出事，恐惧是危险就在眼前时的怕。"],
    ["怀念","huái niàn","对过去的人或事心里惦记，希望再回到那时候","回忆","在脑子里重新想起过去经历过的事","遗忘","忘掉了，再也想不起来",1,"回忆只是想起来，怀念还带着想回去的感情。"],
    ["后悔","hòu huǐ","事情过后，觉得当初不该那么做","遗憾","对没能如愿的事感到可惜","庆幸","因结果比预想的好而感到幸运、高兴",1,"遗憾的是事情没成，后悔的是自己做过的事。"],
    ["期待","qī dài","心里盼着某件事发生","憧憬","向往美好的未来，脑子里先把它想出来","抵触","心里抗拒，不愿意接受",1,"憧憬的对象是将来美好的样子，期待的对象是某件具体的事。"],
    ["感动","gǎn dòng","因别人的好意或某件事，心里受到触动","感激","对别人的帮助心里怀着谢意","麻木","对事情没有感觉，反应迟钝",1,"感激是想说谢谢，感动是心里被触动得想哭。"],
    ["委屈","wěi qu","觉得自己受到了不公正的对待，心里难受","不满","觉得不合心意，心里有意见","满意","觉得合心意，没有什么可说的",1,"不满是觉得事情不好，委屈是觉得自己被冤枉了。"],
    ["嫉妒","jí dù","看到别人比自己好，心里不舒服，甚至希望对方不好","羡慕","看到别人好，自己也希望拥有","欣赏","看到别人的好处，心里认可、喜欢",1,"羡慕是想“我也要有”，嫉妒是“你最好没有”。"],
    ["孤独","gū dú","独自一人，没有可以说说话、相处的人","安静","没有声音，不吵闹","热闹","人多，气氛活跃",1,"安静是环境没有声音，孤独是心里没有人。"],

    ["自暴自弃","zì bào zì qì","自己看不起自己，甘心落后，不求上进","破罐破摔","反正已经坏了，索性不再努力","自强不息","自己努力向上，不停下",2,"破罐破摔多指一件事，自暴自弃是对整个人生。"],
    ["见异思迁","jiàn yì sī qiān","看到别的事物就改变主意，意志不坚定","三心二意","心思不专一，拿不定主意","一心一意","心思专一，只想着这一件事",2,"三心二意是心思乱，见异思迁是看到新的就想换。"],
    ["优柔寡断","yōu róu guǎ duàn","做事犹豫，拿不定主意","举棋不定","下棋时拿着棋子不知走哪步，比喻拿不定主意","当机立断","抓住时机，马上做决定",2,"举棋不定是某一刻拿不准，优柔寡断是性子如此。"],
    ["雷厉风行","léi lì fēng xíng","做事声势大，行动快","风驰电掣","像风和闪电一样快","拖泥带水","做事不干脆，拖拖拉拉",2,"风驰电掣只讲快，雷厉风行还讲有气势。"],
    ["精益求精","jīng yì qiú jīng","已经很好了，还要求更好","锦上添花","在美好的事物上再增添美好","得过且过","能过下去就过，不求上进",2,"锦上添花是加好，精益求精是再好还要好。"],
    ["全神贯注","quán shén guàn zhù","全部精神都集中在一件事上","目不转睛","眼睛一动不动地看","心不在焉","心思不在这里，注意力不集中",2,"目不转睛是眼睛看住，全神贯注是整个心思都在。"],
    ["废寝忘食","fèi qǐn wàng shí","顾不上睡觉和吃饭，形容非常专心努力","夜以继日","白天接着黑夜地干","游手好闲","游荡懒散，不愿干活",2,"夜以继日讲时间连着，废寝忘食讲连吃睡都忘了。"],
    ["任劳任怨","rèn láo rèn yuàn","做事不怕辛苦，也不怕别人埋怨","勤勤恳恳","做事认真踏实，不怕辛苦","拈轻怕重","挑轻活干，怕重的",2,"勤勤恳恳只是肯干，任劳任怨还受得住委屈。"],
    ["精打细算","jīng dǎ xì suàn","用钱用物仔细计算，不浪费","勤俭节约","勤劳节俭，不浪费","挥金如土","花钱像撒土一样，毫不吝惜",2,"勤俭节约讲习惯，精打细算是当场算得清。"],
    ["量入为出","liàng rù wéi chū","根据收入多少来安排支出","省吃俭用","吃的用的都很节省","入不敷出","收入不够支出",2,"省吃俭用是省，量入为出是按收入定花多少。"],

    /* ===== 成语：学习 ===== */
    ["温故知新","wēn gù zhī xīn","复习学过的内容，从中得到新的理解","举一反三","从一件事推知许多同类的事","一知半解","知道得很少，理解得不深",2,"举一反三是会推，温故知新是复习出新东西。"],
    ["融会贯通","róng huì guàn tōng","把各方面的知识综合起来，理解得全面透彻","学以致用","学了知识用到实际中去","生搬硬套","不顾实际，照搬别人的做法",2,"学以致用是拿去用，融会贯通是打通了。"],
    ["循序渐进","xún xù jiàn jìn","按照一定的步骤逐渐深入","按部就班","按照一定的条理、步骤做事","急于求成","急着要成功，不管过程",2,"按部就班讲照步骤，循序渐进讲一步步深入。"],
    ["不耻下问","bù chǐ xià wèn","向不如自己的人请教也不觉得丢脸","虚心求教","谦虚地向别人请教","自以为是","自己认为自己对，不听别人意见",2,"虚心求教是态度，不耻下问特别指问不如自己的人。"],
    ["囫囵吞枣","hú lún tūn zǎo","把枣整个吞下去，比喻学习不加分析，全盘接受","走马观花","骑在马上看花，粗略地看一遍","融会贯通","把各方面知识综合起来，理解透彻",2,"走马观花是看得粗，囫囵吞枣是读了不消化。"],
    ["事倍功半","shì bèi gōng bàn","花的力气大，收到的效果小","徒劳无功","白费力气，没有一点成效","事半功倍","花的力气小，效果大",2,"徒劳无功是白干，事倍功半是干了但慢。"],
    ["事半功倍","shì bàn gōng bèi","花的力气小，收到的效果大","一举两得","做一件事得到两方面的好处","事倍功半","花的力气大，效果却小",2,"一举两得讲两件事都成，事半功倍讲省力。"],

    /* ===== 成语：做事 ===== */
    ["画蛇添足","huà shé tiān zú","做了多余的事，反而把事情弄坏","多此一举","做了不必要的事","恰到好处","正好做到合适的地方",2,"多此一举只是白做，画蛇添足还把事弄坏了。"],
    ["雪中送炭","xuě zhōng sòng tàn","别人急需的时候给予帮助","解囊相助","拿出钱来帮助别人","落井下石","别人落难时反而加以打击",2,"解囊相助是给钱，雪中送炭是给的正是时候。"],
    ["亡羊补牢","wáng yáng bǔ láo","出了问题以后及时补救，防止再受损失","迷途知返","走错了路知道回来，及时改正","听之任之","听凭它发展，不加过问",2,"迷途知返是改自己，亡羊补牢是补漏洞。"],
    ["拔苗助长","bá miáo zhù zhǎng","违反事物规律，急于求成，反而坏事","急于求成","急着要成功，不管过程","循序渐进","按步骤一步步深入",2,"急于求成只是心太急，拔苗助长还动手坏了事。"],
    ["守株待兔","shǒu zhū dài tù","死守过去的经验，不主动努力，妄想不劳而获","刻舟求剑","不懂情况已经变化，仍按老办法办事","随机应变","根据情况变化灵活处理",2,"刻舟求剑是办法过时，守株待兔是想不劳而获。"],
    ["掩耳盗铃","yǎn ěr dào líng","自己欺骗自己，以为别人不知道","自欺欺人","欺骗自己，也欺骗别人","实事求是","按实际情况办事，不夸大不缩小",2,"自欺欺人还包括骗别人，掩耳盗铃主要是骗自己。"],
    ["弄巧成拙","nòng qiǎo chéng zhuō","本想耍聪明，结果做了蠢事","画虎类犬","模仿不到家，反而弄得不伦不类","歪打正着","方法本来不对，却碰巧做对了",2,"画虎类犬是学不像，弄巧成拙是聪明反被聪明误。"],
    ["因小失大","yīn xiǎo shī dà","为了小的利益，丢了大的利益","得不偿失","得到的抵不上失去的","两全其美","两方面都照顾到，都很圆满",2,"得不偿失是算总账，因小失大是只顾眼前小的。"],
    ["一箭双雕","yī jiàn shuāng diāo","做一件事，同时达到两个目的","一举两得","做一件事得到两方面的好处","顾此失彼","顾了这个，丢了那个",2,"一举两得是得好处，一箭双雕常指达到两个目的。"],
    ["有始有终","yǒu shǐ yǒu zhōng","做事从开始到结束都认真对待","善始善终","开头做得好，结尾也做得好","虎头蛇尾","开头声势大，后来劲头小",2,"善始善终强调结尾好，有始有终强调全程不倒。"],
    ["三思而行","sān sī ér xíng","做事以前反复考虑","谨小慎微","过分小心，怕这怕那","轻举妄动","不经过考虑就随便行动",2,"谨小慎微是胆子被吓小了，三思而行是想清楚再动。"],

    /* ===== 成语：说话 ===== */

    ["口若悬河","kǒu ruò xuán hé","说话像瀑布一样滔滔不绝","滔滔不绝","话说得连续不断","哑口无言","说不出话来，像哑巴一样",2,"滔滔不绝只讲不断，口若悬河还讲有气势。"],
    ["夸夸其谈","kuā kuā qí tán","说话浮夸，不切实际","高谈阔论","大声谈论，说得多而不实","脚踏实地","做事踏实，不浮夸",2,"高谈阔论偏在场面，夸夸其谈偏在吹自己。"],
    ["花言巧语","huā yán qiǎo yǔ","虚假而动听的话","甜言蜜语","为讨人喜欢而说的好听的话","肺腑之言","发自内心的真话",2,"甜言蜜语多在感情上，花言巧语多为了骗人。"],
    ["言简意赅","yán jiǎn yì gāi","话说得少，意思却完整清楚","简明扼要","简单明了，抓住要点","长篇大论","文章或讲话又长又空",2,"简明扼要是写法，言简意赅还强调意思全。"],
    ["语无伦次","yǔ wú lún cì","话说得没有条理，前后接不上","颠三倒四","说话做事错乱，没有次序","有条有理","说话做事有顺序、有层次",2,"颠三倒四是来回重复，语无伦次是连不成句。"],
    ["一针见血","yī zhēn jiàn xiě","说话直接指出问题的要害","开门见山","说话写文章直截了当，不绕弯子","隔靴搔痒","没有抓住关键，解决不了问题",2,"开门见山讲不绕弯，一针见血讲说中要害。"],
    ["三言两语","sān yán liǎng yǔ","很少的几句话","只言片语","个别的词句，零碎的话","千言万语","形容话非常多",2,"只言片语是零碎的，三言两语是完整而简短。"],
    ["强词夺理","qiǎng cí duó lǐ","本来没理，硬说成自己有理","无理取闹","没有道理还故意吵闹","据理力争","根据道理力争，不肯让步",2,"无理取闹是闹，强词夺理是把歪理说圆。"],

    ["一帆风顺","yī fān fēng shùn","事情进行顺利，没有阻碍","万事如意","一切事情都合乎心意","一波三折","事情进行中波折很多",2,"万事如意讲心愿，一帆风顺讲过程顺。"],
    ["雪上加霜","xuě shàng jiā shuāng","本来已经不好，又受到新的打击","火上浇油","使别人更加恼怒，使事情更糟","锦上添花","在美好的事物上再增添美好",2,"火上浇油是多在情绪上，雪上加霜是多在难处上。"],
    ["措手不及","cuò shǒu bù jí","事情来得突然，来不及应付","手忙脚乱","做事慌张，没有条理","从容不迫","镇定自若，一点也不急",2,"手忙脚乱是乱，措手不及是根本没时间准备。"],
    ["泰然自若","tài rán zì ruò","遇到特殊情况仍然镇定自然","若无其事","像没有发生什么事一样","惊慌失措","吓得不知道该怎么办",2,"若无其事可能是不在乎，泰然自若是稳得住。"],
    ["无动于衷","wú dòng yú zhōng","心里一点也不感动、不关心","麻木不仁","反应迟钝，对事情不关心","心潮澎湃","心里像波浪一样翻腾，很激动",2,"麻木不仁是感觉坏了，无动于衷是这次没被打动。"],
    ["迫不及待","pò bù jí dài","急得一刻也等不了","跃跃欲试","心里急切地想试一试","慢条斯理","说话做事慢慢来，不着急",2,"跃跃欲试是想动手，迫不及待是等不了。"],
    ["望眼欲穿","wàng yǎn yù chuān","盼得非常急切，眼睛都快望穿了","朝思暮想","早晚都在想，非常想念","漠不关心","一点也不关心",2,"朝思暮想是想，望眼欲穿是盼着见面。"],
    ["千钧一发","qiān jūn yī fà","情况非常危急，随时可能出事","迫在眉睫","事情就在眼前，必须马上处理","安然无恙","平安无事，没有受到损伤",2,"迫在眉睫是时间紧，千钧一发是危险大。"],
    ["井井有条","jǐng jǐng yǒu tiáo","安排得很有条理，一点也不乱","有条不紊","有条理，一点不乱","乱七八糟","非常乱，没有头绪",2,"有条不紊多指步骤，井井有条多指摆放安排。"],

    ["一意孤行","yī yì gū xíng","不听别人劝告，坚持按自己的想法做","独断专行","只凭自己的意思做决定，不听别人","集思广益","集中大家的智慧，广泛听取意见",2,"独断专行多指有权的人，一意孤行谁都可能。"],

    ["大同小异","dà tóng xiǎo yì","大部分相同，只有小的差别","相差无几","彼此差别很小","天壤之别","相差极大，像天和地一样",2,"相差无几不一定是同类的，大同小异是同中找不同。"],
    ["截然不同","jié rán bù tóng","完全不同，界限分明","大相径庭","相差很远，大不相同","如出一辙","像同一个车辙出来的，非常相似",2,"大相径庭只是差得远，截然不同还讲界线清。"],
    ["微乎其微","wēi hū qí wēi","非常小，少得几乎可以不算","九牛一毛","许多牛身上的一根毛，比喻极小的一部分","举足轻重","地位重要，一动就影响全局",2,"九牛一毛讲占的比例，微乎其微讲本身极小。"],
    ["无足轻重","wú zú qīng zhòng","不重要，有没有都一样","可有可无","有没有都可以","举足轻重","地位重要，一动就影响全局",2,"可有可无讲可用可不用，无足轻重讲分量小。"],
    ["画龙点睛","huà lóng diǎn jīng","在关键处加上一笔，使整体更出色","锦上添花","在美好的事物上再增添美好","画蛇添足","做了多余的事，反而弄坏",2,"锦上添花是添好东西，画龙点睛是点在最要紧处。"],
    ["各得其所","gè dé qí suǒ","每个人或每样东西都得到合适的安排","各有所长","各有各的长处","大材小用","大材料用在小处，指人才使用不当",2,"各有所长讲本事，各得其所讲安排。"],
    ["水到渠成","shuǐ dào qú chéng","条件成熟了，事情自然成功","顺理成章","做事合乎条理，自然有结果","拔苗助长","违反规律急于求成，反而坏事",2,"顺理成章偏讲情理，水到渠成偏讲时机条件。"],
    ["理所当然","lǐ suǒ dāng rán","按道理就应该这样，不容怀疑","天经地义","非常正确、不能改变的道理","岂有此理","哪有这样的道理，表示非常气愤",2,"天经地义分量更重，理所当然只是按常理应当。"],
    ["不以为然","bù yǐ wéi rán","不认为是对的，表示不同意","不以为意","不把它放在心上，不重视","心悦诚服","心里佩服，完全接受",2,"不以为然是觉得不对，不以为意是根本没在意。"],
    ["无独有偶","wú dú yǒu ǒu","虽然少见，却不止一个，还有配对的","屡见不鲜","经常见到，不觉得新鲜","独一无二","只有一个，没有相同的",2,"屡见不鲜讲常见，无独有偶讲少见但成对。"],
    ["司空见惯","sī kōng jiàn guàn","看惯了，觉得很平常","习以为常","常做某事，就当成平常的事","少见多怪","见识少，遇到不常见的事就大惊小怪",2,"习以为常偏自己的习惯，司空见惯偏大家都看惯了。"],
    ["首当其冲","shǒu dāng qí chōng","最先受到攻击或遭遇灾难","一马当先","走在最前面，带头行动","置身事外","把自己放在事情外面，不参与",2,"一马当先是主动带头，首当其冲是被动先挨。"],
    ["不胫而走","bù jìng ér zǒu","没有腿却能跑，形容消息传得很快","不翼而飞","没有翅膀却不见了，形容东西突然丢失","秘而不宣","守住秘密，不公开",2,"不胫而走讲消息传开，不翼而飞讲东西不见。"],
    ["差强人意","chā qiáng rén yì","大体上还能让人满意","称心如意","完全合乎心意","大失所望","非常失望",2,"差强人意是好歹能接受，称心如意是样样都好。"],
    ["万人空巷","wàn rén kōng xiàng","家家户户的人都出来了，形容非常热闹的盛况","人山人海","人非常多，像山和海一样","门可罗雀","门前可以张网捕鸟，形容十分冷清",2,"人山人海讲人多，万人空巷讲人都出来看一件盛事。"],
    ["胸无点墨","xiōng wú diǎn mò","肚子里没有一点墨水，指没有学问","目不识丁","一个字也不认识","学富五车","读书多，学问大",2,"目不识丁讲不识字，胸无点墨讲没有学问。"],
    ["妙笔生花","miào bǐ shēng huā","笔下有神，能写出好文章","出口成章","话说出来就是文章，形容口才好","江郎才尽","才能用完了，再也写不出好东西",2,"出口成章讲口才，妙笔生花讲文笔。"],
    ["余音绕梁","yú yīn rào liáng","歌声停止后余音还在梁间回绕，形容歌声优美","娓娓动听","说话生动，使人爱听","不堪入耳","言语粗俗或声音难听，使人听不下去",2,"娓娓动听多指说话，余音绕梁多指歌声。"],
    ["见风使舵","jiàn fēng shǐ duò","看情况随时改变态度，哪边有利往哪边倒","随机应变","根据情况变化灵活处理","始终如一","自始至终一个样",2,"随机应变是灵活办事，见风使舵是为自己投机。"],
    ["改过自新","gǎi guò zì xīn","改正错误，重新做人","痛改前非","彻底改正以前的错误","执迷不悟","一直不觉悟，坚持错误",2,"痛改前非讲下决心，改过自新还讲以后做新人。"],
    ["知恩图报","zhī ēn tú bào","受了别人的恩惠，想着报答","感恩戴德","对别人的恩德非常感激","忘恩负义","忘了别人的恩情，做出对不起人的事",2,"感恩戴德是感激在心里，知恩图报是想着回报。"],
    ["将心比心","jiāng xīn bǐ xīn","拿自己的心去比别人的心，设身处地为别人想","推己及人","用自己的想法去推想别人","自私自利","只顾自己，不管别人",2,"推己及人偏讲道理，将心比心偏讲感情。"],
    ["设身处地","shè shēn chǔ dì","把自己放在别人的位置上想问题","身临其境","亲身到了那个地方，感受很深","置身事外","把自己放在事情外面，不参与",2,"身临其境是到了那个地方，设身处地是站到别人位置。"],
    ["井底之蛙","jǐng dǐ zhī wā","井底的青蛙，比喻见识短浅的人","孤陋寡闻","见识少，听到的也少","见多识广","见过的多，知道的广",2,"孤陋寡闻讲知道得少，井底之蛙讲眼界被环境困住。"],
    ["胸有成竹","xiōng yǒu chéng zhú","做事之前心里已经有了完整的打算","十拿九稳","很有把握，几乎不会失手","心中无数","心里没有底，不知道怎么办",2,"十拿九稳讲结果有把握，胸有成竹讲事先想好了。"],
    ["熟视无睹","shú shì wú dǔ","看惯了就像没看见一样，不加理会","视而不见","看见了当作没看见","刮目相看","用新的眼光看待别人",2,"熟视无睹是因为常见而麻木，视而不见可以是故意。"],
    ["无微不至","wú wēi bù zhì","关怀照顾得非常细致周到，没有一处想不到","面面俱到","各方面都照顾到，没有遗漏","漠不关心","一点也不关心",2,"面面俱到讲做事周全，无微不至讲关心人细。"],

    ["救人","jiù rén","把人从危险中救出来","救助","给处于困难的人以帮助","害人","使人受到伤害",1,"救助范围更广，救人是把人从危险里弄出来。"],

    ["线索","xiàn suǒ","能帮助查清事情的迹象或提示","痕迹","留下的印子","误导","把人引到错误的方向",1,"痕迹是留下的印，线索是能顺着查下去的提示。"],

    ["揭露","jiē lù","把隐藏的事公开出来","揭发","把别人的错误或罪行检举出来","隐瞒","把真实情况藏起来不让人知道",1,"揭发多指向有关部门检举，揭露是把事摆到大家面前。"],

    ["亡命天涯","wáng mìng tiān yá","为了活命四处逃亡，流落远方","流离失所","到处流浪，没有安身的地方","安居乐业","安定地生活，愉快地劳动",2,"流离失所是没了家，亡命天涯是为逃命。"],

    ["彷徨","páng huáng","心里不安，来回犹豫，不知往哪去","犹豫","拿不定主意","果断","拿定主意就立刻去做",1,"犹豫是选哪个，彷徨是连方向都没有。"],

    ["隔阂","gé hé","彼此之间有了距离，话说不通","误会","理解错了对方的意思","融洽","相处得好，没有隔阂",1,"误会是一件事，隔阂是长期的心墙。"],
    ["和解","hé jiě","双方停止争执，重归于好","妥协","各自让一步，达成一致","决裂","关系彻底破裂",1,"妥协是让步，和解是关系恢复。"],

    ["寄托","jì tuō","把希望、感情放在某人或某事上","依靠","靠别人或别的东西支持","抛弃","扔掉，不要了",1,"依靠是生活上靠，寄托是心里放。"],

    ["迫不得已","pò bù dé yǐ","没有别的办法，只能这样做","勉强","不是心甘情愿，凑合着做","心甘情愿","心里愿意，一点都不勉强",2,"勉强是心里不愿，迫不得已是没有选择。"],

    ["精神","jīng shén","人的意识、情绪和意志，和身体相对","意志","决定做一件事并坚持下去的心理力量","肉体","人的身体",1,"意志是精神里“坚持”的那一部分。"],

    ["泾渭分明","泾河水清，渭河水浑，泾河的水流入渭河时，清浊不混，比喻界限清楚。",""],

    ["交口称赞","众口同声赞誉。",""],
    ["渐入佳境","原指甘蔗从上往下吃，越吃越甜。后用以比喻境况逐渐好转或兴味日益浓厚。",""],
    ["举足轻重","一抬足就影响两边分量的轻重。一举一动都关系到全局。形容所处地位重要，足以左右局势。",""],
    ["举案齐眉","案：古时有脚的托盘。汉代梁鸿的妻子给他送饭时，总是把端饭的盘子举得高高的，后泛用以形容夫妻相敬。",""],
    ["匠心独运","巧妙的心思，独特的构思。",""],

    ["居高临下","处在高处，俯视下面。形容处于有利或优越的地位。临，面对。而例句中只把它理解为“一定的高度”，看事情的立足点出现了问题。",""],

    ["计日程功","可以数着日子计算进度。形容在较短期间就可以成功。程，计算。",""],
    ["江郎才尽","比喻才思枯竭。",""],
    ["胶柱鼓瑟","比喻拘泥固执，不知变通。柱瑟上调弦的短木，被粘住，就不能调整音高。",""],
    ["狡兔三窟","狡猾的兔子有三个洞穴。原来比喻藏身的地方多，便于逃避灾祸。现在多用贬义。",""],
    ["精卫填海","精卫，神话中的鸟名。比喻意志坚定。",""],
    ["锦口绣心","形容文思优美，词藻华丽。",""],
    ["精骛八极，心游万仞","八极：喻极远之处。万仞：喻极高之处。意谓诗人进行艺术构思，不受时空之限制而驰骋无边。",""],
    ["可圈可点","“可”：值得。“圈点”：古人读书，在精彩或重要处加圈加点。现在是值得欣赏、值得赞美。",""],

    ["慷慨解囊","是资助别人，不是自己花钱买东西。",""],
    ["涸辙之鲋","涸：,水干。鲫鱼。干困在车辙沟里的鲫鱼。比喻处于困境亟待援助的人。",""],
    ["开源节流","比喻经济上增加收入，节省开支。",""],
    ["开宗明义","宗：主旨，文章的主题，行动的目的等。指说话写文章一开始就把主要意思点明白。",""],

    ["空前绝后","从前没有过，今后也不会再有。夸张性地形容独一无二。",""],
    ["空穴来风","有了洞穴才进风。比喻乘隙而入，常指某种消息和谣言的传布不是完全没有原因的。",""],

    ["苦心孤诣","苦心：刻苦的用心。孤诣：别人所达不到的。用尽心思刻苦钻研，达到了别人所达不到的境界。",""],
    ["苦口婆心","形容怀着好心再三诚恳地劝告。一般用于劝告那些不能较快地认识自己缺点错误的人。",""],
    ["刻骨铭心","比喻牢牢记在心上，永远不忘（多用于对别人的感激）。",""],
    ["脍炙人口","脍，，切得很细的肉或鱼；炙，，烤熟的肉。美味人人喜欢吃，比喻好的诗文或事物，人们都称赞。",""],
    ["刻鹘类鹜","鹘，天鹅；鹜，鸭。刻画天鹅不像，但还像个鸭子。意思是仿效得虽然不太逼真，但还相似。",""],
    ["李代桃僵","原指李桃共患难。比喻兄弟相爱相助。后指互相顶替或代人受过。",""],
    ["力透纸背","原指书法遒劲有力。后也用来形容诗文立意深刻，用词精当。",""],

    ["冷若冰霜","形容人不热情、不温和。也形容态度严肃，使人不易接近。",""],
    ["淋漓尽致","淋漓：形容尽情，酣畅。尽致：达到极点。形容文章、说话表达得充分、详尽。不能理解为被批驳得“体无完肤”。",""],

    ["临危受命","“受”是“接受”之意，该成语指在危难之际接受任命。",""],
    ["洛阳纸贵","晋代左思写成《三都赋》，抄写的人很多，洛阳的纸因此涨价。现在多称誉别人的著作，风行一时。",""],

    ["梁上君子","躲在屋梁上的先生。代称窃贼。语见《后汉书》。往往误解为“行为高尚的人”。",""],

    ["良莠不齐","莠：狗尾草，很象谷子，常混在禾苗中。比喻好人坏人都有，混杂在一起。",""],

    ["牢不可破","牢固得不可摧毁，不可动摇，形容异常坚固。一般指友谊、团结等不可解开。",""],
    ["老气横秋","①形容人摆老资格，自以为了不起的样子；②也形容人没有朝气，暮气沉沉的样子。多用于年轻人身上。",""],
    ["老生常谈","老书生常讲的话，没有新意思。比喻听惯听厌的话。",""],

    ["来日方长","未来的日子还很长。表示事有可为，劝人不必急于做某事。",""],
    ["龙飞凤舞","本来形容气势奔放雄壮，也可形容书法气势舒展活泼，也可形容字迹潦草难辨。",""],

    ["门户之见","门户：派别；见：成见。因派别不同而产生的成见。",""],
    ["门可罗雀","大门前面可张网捕雀。形容宾客很少，家里很安静，或社会交往很少。",""],

    ["木人石心","木人：指其人像木一样正直。石心：指其信念像金石一样坚牢。比喻人的意志坚定，不为外物所动心，不为情感、欲念所动摇。不能理解为“如木人一样，呆板，愚蠢，死板”。",""],

    ["明日黄花","过了重阳的菊花。意思是即将枯萎，没有什么可玩赏了。比喻过时的事物。不能误写成“昨日黄花”。",""],

    ["满城风雨","比喻消息一经传出，就到处轰动起来，议论纷纷。贬义。常被用作褒义或误解为“局势混乱”。",""],

    ["眉来眼去","①多用于男女示爱，②也指坏人之间勾勾搭搭。",""],
    ["妙手偶得","技术高超的人，偶然间即可得到。也用来形容文学素养很深的人，出于灵感，即可偶然间得到妙语佳作。",""],
    ["难能可贵","指不容易做到的事居然能做到，非常可贵。用于表扬人。不能用于赞美景物。",""],

    ["难言之隐","隐：隐情，藏在内心深处的事。指难以说出的事物或原因。",""],
    ["南辕北辙","比喻行动和目的正好相反。不形容两个人方向相反。",""],
    ["南腔北调","原指戏曲的南北腔调。现形容说话口音不纯，搀杂着方言。",""],

    ["脑满肠肥","形容不劳而食的人吃得很饱，养得很胖。",""],
    ["牛刀小试","牛刀：宰牛的刀；小试：稍微用一下，初显身手。比喻有大本领的人，先在小事情上略展才能。也比喻有能力的人刚开始工作就表现出才。",""],
    ["浓墨重彩","用浓重的墨汁和颜色来描绘。形容着力描写。",""],

    ["呕心沥血","呕：吐；沥：一滴一滴。比喻用尽心思。多形容为事业、工作、文艺创作等用心的艰苦。","褒"],

    ["评头论足","亦作“品头论足”“评头品足”。指无聊的人随便谈论妇女的容貌，也比喻在小节上多方挑剔。",""],

    ["萍水相逢","像水里浮萍随水漂泊，聚散无定。比喻不相识的人偶然相遇。",""],
    ["披肝沥胆","披：披露，揭开。往下滴。剖开肺腑，露出肝胆。比喻竭尽忠诚，开诚相见。",""],
    ["蓬荜增辉","也说“蓬荜生辉”。即蓬门荜户，用蓬草、荆竹树枝编成门户的房子，形容房子的简陋。表示由于别人到自己家里来或张挂别人题赠给自己的字画而使自己非常光荣。",""],

    ["皮之不存，毛将焉附","比喻基础没有了，建筑在基础上的东西也就无法存在。",""],

    ["歧路亡羊","岔道多，丢失了羊。比喻事理复杂多变，没有正确的方向，因而找不到真理。",""],
    ["奇文共赏","①原指奇特的文章共同欣赏，褒义。②现多指共同阅读、识别、评判和研究有问题的文章，多含贬义。",""],

    ["前倨后恭","先傲慢而后恭敬。",""],
    ["前赴后继","赴，向前冲前面的冲上去了，后面的紧跟上来。形容连续不断投入战斗，奋勇冲杀向前。褒义词",""],
    ["巧舌如簧","乐器里薄叶状的发声振动体。形容能说会道，花言巧语。",""],
    ["巧言令色","巧言：虚伪的好话。令色：讨好别人的表情。形容花言巧语，假装和善的样子。",""],

    ["清规戒律","原指佛教寺院所订立的规则和戒律。比喻繁琐、不合理的成规、惯例。有时泛指规章制度。",""],
    ["鹊巢鸠占","喜鹊的巢被斑鸠占住。原比喻女子出嫁，以夫家为家。后来比喻坏人强占别人住处。",""],
    ["奇货可居","奇货：稀有的、珍贵的货物。居：储藏。把稀有的货物储藏起来，等待高价出售。也比喻挟持某种独特的技能或成就作为资本，以博取名利地位。",""],
    ["气宇轩昂","亦作“器宇轩昂”。器宇：仪表、风度。轩昂：精神饱满的样子。形容人气度不凡。",""],
    ["气冲霄汉(褒）","形容大无畏的精神和气概。",""],
    ["气冲斗牛","斗牛：二十八星宿中的斗宿和牛宿，借指天空。①形容精神旺盛，意气高昂；②非常生气，愤慨之极。",""],
    ["起死回生","把将要死的人医活，形容医术高明。",""],
    ["求全责备","对人对事物要求十全十美，毫无缺点。意思用对了，但“求全责备”不能带宾语，要说成“对……求全责备”。津津乐道、求全责备、司空见惯、漠不关心都不带宾语。",""],
    ["权衡轻重","衡量轻和重，比较主次得失。一般用于决策前估量利弊得失。",""],
    ["庆父不死，鲁难未已","庆父：鲁庄公的弟弟。未已：没有完。比喻不把制造祸乱的罪魁祸首清除，灾难就会不断发生，永无宁日。",""],
    ["青梅竹马","指男女双方在孩童时代就曾天真地在一起玩耍，不能用于同性之间。",""],
    ["青出于蓝","不适合西部地区与沿海地区的关系。",""],
    ["情不自禁","感情激动，控制不住自己，不由自主易于混淆。",""],
    ["倾巢出动","贬义，不能用于公安干警。",""],
    ["轻描淡写","原指用浅淡的颜色描画；今多指说话、作文时将某些事情轻轻带过视，",""],
    ["轻歌曼舞","轻松愉快的音乐和柔和优美的舞蹈。“曼”不作“慢”，不是“缓慢”的意思。",""],
    ["杞人忧天","比喻不必要的忧虑。",""],
    ["期期艾艾","汉代周昌口吃，讲起话来常重复说“期期”；三国魏的邓艾也口吃，在说到自己时连称“艾艾”，后人引申出“期期艾艾”这句成语，形容人口吃。",""],
    ["旗开得胜","指军队的战旗刚一展开就取得胜利，比喻事情一开始就取得好成绩。",""],
    ["七月流火","指天气逐渐凉爽起来。“火”在这里指火星，而不指大火。",""],
    ["偷工减料","原指商人为了牟取暴利而暗中降低产品质量，削减工料。现也指做事图省事，马虎敷衍。",""],
    ["秦晋之好","指两家联姻，并不指两国的关系友好俄两国终于重结秦晋之好。",""],
    ["翘足而待","一抬脚的功夫就可等到，形容很快就会实现。",""],
    ["沁人心脾","形容诗歌和文章优美动人，给人清闲爽朗的感觉。",""],
    ["七手八脚","形容大家一起动手，人多手杂的样子。",""],
    ["穷而后工","旧时认为文人处境困穷，诗就写得好。工：巧妙。",""],
    ["囚首垢面","监狱里的犯人很久没有梳头和洗脸。形容不注意个人仪表清洁与修饰。",""],
    ["赤地千里","形容天灾或战争造成大量土地荒凉的景象。",""],
    ["忍俊不禁","忍俊：含笑。忍不住要发笑。",""],
    ["人微言轻","指职位低，说话就不起作用。",""],
    ["人浮于事","工作人员的数目超过工作的需要；事少人多。",""],
    ["人满为患","强调人多的坏处，贬义。错用于表示人很多的情景，如“柜台前人满为患”之类。",""],
    ["人心不古","旧时认为古风淳朴。人的心地不如古人那样淳朴。古，指古代的社会风尚。往往误解为“人的思想或精神没有老化”。",""],
    ["人言啧啧","其中的“啧啧”与“啧啧赞叹”的“啧啧”不同义，而是指不满意地纷纷议论．“人言啧啧”是指人们不满地纷纷议论开来。",""],
    ["人老珠黄","指妇女因为老了被轻视，就像珠子年代久了会变黄，不如新珠子值钱一样。",""],
    ["日长一线","不是指每天增长一线，而是指冬至后日昼渐长。",""],
    ["日中则昃","太阳行至正中就要偏向西方。比喻盛极必衰。昃：太阳偏西。",""],
    ["心劳日拙","费尽心机反而一天天地窘困。",""],
    ["如履薄冰","比喻行事特别谨慎，存有戒心。只能用于主观心理，不能表示客观存在的危险状态",""],
    ["如蚁附膻","像蚂蚁附着在有膻味的东西上，比喻趋炎附势或追逐名利的肮脏行为。",""],
    ["如丧考妣","好像死了父母一般的伤心和着急，含贬义。",""],
    ["如坐春风","像处于春风一样，受教育、感化很深。比喻受到教育和感化。",""],
    ["如数家珍","像数自己家里的珍宝一样，形容对列举的事物或叙述的故事十分熟悉。",""],
    ["如芒在背","好像芒刺扎在背上。形容惶恐不安。不能用作“好像如芒在背”。",""],
    ["忍痛割爱","忍受痛苦，不情愿地放弃自己心爱的东西，或把自己心爱的东西交给别人。",""],
    ["任重道远","担子很重，路途遥远。比喻责任重大，而且要经历长期的奋斗。",""],
    ["让枣推梨","指兄弟友爱，不用于其他关系。",""],
    ["弱不胜衣","形容人很瘦弱，连衣服也承受不起。",""],
    ["始作俑者","专指坏风气的创始者",""],
    ["是古非今","肯定古代否定现代。不能理解为“是古代而非现代”。",""],
    ["是可忍孰不可忍","对人的重大罪行不可容忍，极度愤慨。不能用于自然灾害。",""],
    ["事倍功半","指工作费力大，收效小。",""],
    ["首鼠两端","首鼠：犹豫，进退两难。形容在两者之间犹豫不决或动摇不定。",""],
    ["首当其冲","冲：要冲，交通要道。处在重要的地位，成为首先受到冲击的目标。",""],
    ["守株待兔","原比喻希图不经过努力而得到成功的侥幸心理。现也比喻死守狭隘经验，不知变通。",""],
    ["闪烁其词","指说话稍微露出一点想法，但不明确。也形容说话躲躲闪闪，吞吞吐吐。",""],
    ["少不更事","年纪轻，经历的事情不多。",""],
    ["适逢其会","恰巧碰到那个时机。",""],
    ["率先垂范","带头给下级或晚辈作示范。",""],
    ["食言而肥","形容为了自己占便宜而说话不算数，不守信用。",""],
    ["食不果腹","形容生活贫困。(果：饱)",""],
    ["水落石出","原形容景色清明。后用以比喻事情的真相大白。",""],
    ["水清无鱼","比喻过分计较人的小缺点就不能团结人。",""],
    ["山穷水尽","山和水都到了尽头，前面再没有路可走了。比喻陷入绝境。",""],
    ["色厉内荏","外表强硬而内心怯懦。",""],
    ["审时度势","全面地观察、研究现状，正确地估计形势。",""],
    ["深孚众望","深得众人的信服。",""],
    ["深谋远虑","计谋周详，考虑深远。",""],
    ["手不释卷","形容勤勉好学或读书入迷。",""],
    ["尸位素餐","形容空占着职位，不做事而白吃饭。也用于自谦，表示没做什么事情。",""],
    ["舍本逐末","做事不从根本上着手，而在枝节上用功夫。",""],
    ["时乖命蹇","时机不准，命运不好。",""],
    ["三人成虎","比喻谣言或讹传一再反复，就有使人信以为真的可能",""],
    ["数典忘祖","数说礼制掌故，却把自己的祖先忘了。比喻忘本。现也用以指对本国历史的无知。",""],
    ["数见不鲜","鲜：新杀的鸟兽。经常来的客人就不宰杀禽畜招待。原意是常到别人家去就惹人讨厌。后来形容事物经常见到，并不新奇。",""],
    ["硕大无朋","大的没有可以相比的。形容巨大无比。",""],
    ["素昧平生","昧：不明白，不了解。平生：从来。指彼此向来不认识。",""],
    ["师心自用","师心：原指心领神会不拘于成法。现形容固执己见，自以为是。",""],
    ["失之交臂","交臂：擦肩而过。形容遇到极好的机会而又当面错过。",""],
    ["失之东隅，收之桑榆","桑榆：傍晚日影落在桑榆树梢，指黄昏。比喻在这边失败了，在那边却得到了胜利。",""],
    ["生杀予夺","予：给与。夺：剥夺。现指反动统治者横行霸道，对人民的生命财产随意处置。",""],
    ["生死攸关","关系到人的生存和死亡。指生死存亡的关键。",""],
    ["生灵涂炭","涂炭：泥沼和炭火，比喻困苦。形容在反动统治下，广大人民处于极端困苦的境地。",""],
    ["司空见惯","司空：古代官名。形容常见之事，不足为奇。",""],
    ["司马青衫","比喻因遭遇相似而表示的同情。",""],
    ["耸人听闻","故意说夸大或惊奇的话，使人震惊。",""],
    ["甚嚣尘上","形容对传闻之事议论纷纷。现多指某种言论十分嚣张，多含贬义",""],
    ["拭目以待","形容急切想看到所期待的事物，或确信某件事情的出现。格出现在舞台上，大家都拭目以待。",""],
    ["视同儿戏","把事情当成小孩儿玩耍一样来对待。比喻不当一回事，极不重视。",""],
    ["石破天惊","比喻艺术创造或议论新奇惊人，不同凡响。媒体多误用于惊人的消息。",""],
    ["死得其所","指死得有价值，有意义，是褒义的。",""],
    ["身临其境","亲自到了那个地方。形容感受深切。",""],
    ["身无长物","长物，多余的东西。形容人除了自身外，东西极少。不可把“长”理解为一技之长",""],
    ["身体力行","亲身经验，努力实行。",""],
    ["设身处地","设：假设，设想。处：置身。设想自己处在别人的地位。指替人着想。",""],
    ["上下其手","比喻玩弄手法，串通作弊。",""],
    ["上行下效","贬义，上级或长辈怎么做，下级或晚辈就跟着学。不用于表示“群众以干部为榜样”。",""],
    ["述而不作","只阐述前人的学说，自己并不创作，并非只讲不作或光说不练之意。",""],
    ["十室九空","十户人家，九家空虚。形容因灾荒、战乱和横征暴敛使得百姓破产或流亡的惨象。不可误解为十户人家九家没人。",""],
    ["涉笔成趣","形容拿笔一挥就可以创作出很有意味很有深度的作品。往往误解为“写文章用笔生动有趣”。",""],
    ["拾人牙慧","拾取别人的只言片语作为自己的话来说，多用来形容一味重复别人而缺乏主见。","贬"],
    ["死有余辜","形容罪大恶极，即使处以死刑也不能抵偿他的罪恶。(辜：罪恶)",""],
    ["盲人瞎马","比喻盲目行动，后果十分危险。",""],
    ["赏心悦目","看到美好的事物而身心愉快。主语是人．如果主语是景物，要说“令人赏心悦目”。而且一般用于美好的景色。",""],
    ["豕突狼奔","像猪那样冲撞，像狼那样奔跑。形容成群的坏人乱冲乱撞，到处骚扰，或敌人逃跑时惊慌失措的样子。",""],
    ["矢志不移","发誓立志，永不改变。",""],
    ["声情并茂","并，都；茂，草木丰盛的样子，引申为美好。指演唱的音色、唱腔和表达的感情都很动人。",""],
    ["桃李不言，下自成蹊","桃树、李树不向人打招呼，树下自然走成一条道。比喻只要为人真诚、忠实，就能感动别人。",""],
    ["特立独行","特,独特；立,立身。形容人的志行高洁，不同流俗,也泛指特殊的，与众不同的。这里用来指历史，对象错误。",""],
    ["弹冠相庆","掸去帽子上的灰尘，表示庆贺。某人当了官或升了官，他的同伙也相互庆贺将有官可做，比喻作好做官的准备，含贬义。",""],
    ["贪多务得","原指尽量多地求得知识，后多指贪心不足(含贬义，该义项使用较多)。",""],
    ["叹为观止","观止：看到了止境。赞叹看到的事物好到了极点。",""],
    ["醍醐灌顶","酥酪上凝聚的油。佛教比喻以智慧灌输与人，使人得到启发。后来泛用以比喻感到清凉舒适",""],
    ["投鼠忌器","比喻做事有顾忌，不敢放手干。",""],
    ["投桃报李","比喻友好往来。",""],
    ["探囊取物","比喻事情极易办成。",""],
    ["忝列其中","谦词，表示辱没他人，自己有愧。",""],
    ["同日而语","比喻同样看待，一概而论。",""],
    ["痛心疾首","痛心：悲愤到极点。疾首：头疼。形容痛恨到极点",""],
    ["兔死狐悲","兔子死了，狐狸感到悲伤。比喻因同类的死亡而感到悲伤。“兔死狐”是一个贬义词，通常是说狼狈为奸的人，看到自己的同党完了，产生“下一个就会是我”的感觉，于是便悲伤起来，流下那么几滴眼泪。",""],
    ["兔起鹘落","比喻动作敏捷，也比喻作画、写字、写文章等下笔迅速，没有停顿。",""],
    ["铤而走险","形容走投无路，被迫冒险。",""],
    ["韬光养晦","隐藏自己的才能、锋芒，不使外露。(韬：隐藏)",""],
    ["推波助澜","贬义词，比喻助长坏事物的声势以扩大影响。",""],
    ["天网恢恢","天道像一个广阔的大网，作恶者逃不出这个网，也就是逃不出天道的惩罚。恢恢，形容非常广大。",""],
    ["脱颖而出","比喻人才崭露头角。",""],
    ["替古人担心","为古人所遇到的困难、危险担忧、发愁。比喻不必要的担心和忧愁。",""],
    ["物伤其类","原指动物因同类遭不幸而哀伤。比喻因同伙受打击而悲伤。用在此处与语境不符。",""],
    ["妄自菲薄","毫无根据的看轻自己。指自轻自贱。",""],
    ["危言危行","“危”是指正直，表示正直的言行。","褒"],
    ["文不加点","写文章很快，不用涂改就写成。形容文思敏捷，写作技巧纯熟。点，涂上一点，表示删去。不能理解为加标点。",""],
    ["文恬武嬉","形容文武官员只知贪图安乐，不把国家大事放在心上。",""],
    ["文过饰非","以种种理由或借口来掩饰自己的过失、错误。",""],
    ["闻过则喜","听到别人指出自己的过失就高兴。形容虚心接受意见。",""],
    ["闻名遐迩","遐，远；迩，近。远近都闻名。形容名声很大。不能用作“海内外闻名遐迩”。",""],
    ["维妙维肖","形容刻画或描摹得非常逼真。",""],
    ["万人空巷","家家户户的人都从巷子里出来了，多用于形容庆祝、欢迎等盛况。",""],
    ["万籁俱寂","万籁：自然界万物发出的各种声音。形容周围环境十分宁静。",""],
    ["万马齐喑","比喻死气沉沉，令人窒息的沉闷局面。",""],
    ["无所不用其极","原意是无处不用尽心力。现指做坏事时任何极端的手段都使出来。","贬"],
    ["无所不为","没有什么不干的，指什么坏事都干。",""],
    ["无所不至","没有达不到的地方。现多形容坏人到处干坏事或所有的坏事都做到了。",""],
    ["无所用心","不动脑筋，什么事情都不会做。贬义。",""],
    ["无动于衷","指对应该关心注意的事情不关心，置之不理。",""],
    ["无出其右","指没有超过他的。",""],
    ["无可非议","非议：批评，不赞成。没有什么可以指责的。",""],
    ["无可厚非","没有必要加以过分的指责。用于有一定小问题的人或事。",""],
    ["无为而治","道家哲学，指统治者什么也不做却使天下大治。",""],
    ["无独有偶","不只一个，竟然还有配对的。",""],
    ["尾大不掉","尾巴太大就不好摇动。比喻部下势力强大，不听从调动指挥。现在也比喻机构庞大，指挥不灵。",""],
    ["蔚为大观","蔚：荟萃，聚集。汇聚成盛大壮丽的景象。",""],
    ["为渊驱鱼·为丛驱雀","原比喻反动统治者施行暴政，老百姓逃亡别国。现比喻不善于团结人，把本来可以争取过来的人赶到对方那边去了。",""],
    ["望风披靡","披靡：草木随风倒伏的样子。草一遇到风就倒伏。比喻为强大势力所压倒，或为敌人气势所震慑，未触即溃",""],
    ["望其项背","能够望见别人的颈项和脊背，表示赶得上或比得上。一般用于否定形式。",""],
    ["望尘莫及","也常用以表示对人敬佩的自谦之词。",""],
    ["望穿秋水","形容盼望得非常急切。",""],
    ["忘乎所以","多形容因骄傲自满而得意忘形。",""],
    ["未雨绸缪","比喻事先做好准备。",""],
    ["微言大义","精微的语言中包含的深刻的意义。往往误解为“话不多但含义深刻”。",""],
    ["温文尔雅","形容人的态度温和、举动文雅。现在有时指做事不大胆泼辣。",""],

  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices(){
    try { voices = synth ? synth.getVoices() : []; } catch(e){ voices = []; }
    updateVoiceNote();
  }
  function pickMandarinVoice(){
    var zh = voices.filter(function(v){ return /^zh/i.test(v.lang); });
    function first(list){ return list.find(function(v){ return v.localService; }) || list[0] || null; }
    var cn = zh.filter(function(v){ return /^zh[-_]CN$/i.test(v.lang); });
    var sg = zh.filter(function(v){ return /^zh[-_]SG$/i.test(v.lang); });
    var tw = zh.filter(function(v){ return /^zh[-_]TW$/i.test(v.lang); });
    var other = zh.filter(function(v){ return !/^zh[-_](HK|MO)$/i.test(v.lang) && !/^yue/i.test(v.lang); });
    return first(cn) || first(sg) || first(tw) || first(other) || null;
  }
  function voiceLabel(v){
    if(!v) return "未找到普通话语音";
    if(/^zh[-_]CN$/i.test(v.lang)) return "普通话";
    if(/^zh[-_]SG$/i.test(v.lang)) return "普通话（新加坡）";
    if(/^zh[-_]TW$/i.test(v.lang)) return "普通话（台湾）";
    return "中文语音";
  }
  function updateVoiceNote(){
    var el = $("voiceNote"); if(!el) return;
    if(!synth){ el.textContent = "此设备不支持读音"; return; }
    if(!voices.length){ el.textContent = "正在加载语音…"; return; }
    var v = pickMandarinVoice();
    if(v){
      el.textContent = voiceLabel(v) + " · " + v.name + " · 切换题后自动读";
      el.title = v.lang;
    }else{
      el.textContent = "未找到普通话语音，请在系统设置里添加";
    }
  }
  if(synth){
    loadVoices();
    if(typeof synth.addEventListener === "function") synth.addEventListener("voiceschanged", loadVoices);
    else synth.onvoiceschanged = loadVoices;
    document.addEventListener("pointerdown", function(){
      loadVoices();
      try { if(synth.paused) synth.resume(); } catch(e){}
    }, { once:true, passive:true });
  }
  function speak(text){
    if(!synth || !text) return;
    try{
      if(synth.speaking || synth.pending) synth.cancel();
      if(synth.paused) synth.resume();
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = "zh-CN";
      u.rate = 0.82;
      u.pitch = 1;
      u.volume = 1;
      if(!voices.length) loadVoices();
      var pick = pickMandarinVoice();
      if(pick) u.voice = pick;
      synth.speak(u);
    }catch(e){}
  }

    return {
      id:i, word:r[0], pinyin:r[1] || PINYIN[r[0]] || "", correct:r[2],
      nearWord:r[3], near:r[4], oppWord:r[5], opp:r[6],
      type:r[7], note:r[8]
    };
  }).concat(EXTRA.map(function(r, i){
    return {
      id: DATA.length + i, word:r[0], pinyin:PINYIN[r[0]] || "", correct:r[1],
      nearWord:"", near:"", oppWord:"", opp:"",
      type:2, note:r[2], alt:true
    };
  })).concat(HSK.map(function(r, i){
    return {
      id: DATA.length + EXTRA.length + i, word:r[0], pinyin:r[1] || PINYIN[r[0]] || "", correct:r[2],
      nearWord:"", near:"", oppWord:"", opp:"",
      type:r[3], note:"", alt:true
    };
  }));

  var ALT_BANK = BANK.filter(function(b){ return b.alt; });

  var store = readStore();
  var setup = { mode:"all", len:"10" };
  var session = null;

  function readStore(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return { answered:0, correct:0, wrong:{}, setup:null };
      var o = JSON.parse(raw);
      return {
        answered: Math.max(0, o.answered | 0),
        correct: Math.max(0, o.correct | 0),
        wrong: (o.wrong && typeof o.wrong === "object") ? o.wrong : {},
        setup: (o.setup && typeof o.setup === "object") ? o.setup : null
      };
    }catch(e){
      return { answered:0, correct:0, wrong:{}, setup:null };
    }
  }

  function writeStore(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
  }

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function wrongCount(){
    var n=0;
    for(var k in store.wrong){ if(Object.prototype.hasOwnProperty.call(store.wrong,k)) n++; }
    return n;
  }

  function poolFor(mode){
    if(mode === "wrong"){
      var out=[], seen={};
      for(var k in store.wrong){
        if(!Object.prototype.hasOwnProperty.call(store.wrong,k)) continue;
        for(var i=0;i<BANK.length;i++){
          if(BANK[i].word === k && !seen[k]){ out.push(BANK[i]); seen[k]=true; break; }
        }
      }
      return out;
    }
    return BANK.filter(function(b){
      if(mode === "word") return b.type === 1;
      if(mode === "idiom") return b.type === 2;
      if(mode === "phrase") return b.type === 3;
      return true;
    });
  }

  function show(name){
    var screens = ["home","quiz","result"];
    screens.forEach(function(id){ $(id).hidden = (id !== name); });
    window.scrollTo(0,0);
  }

  function start(mode, len){
    var pool = shuffle(poolFor(mode));
    if(!pool.length){ renderHome(); show("home"); return; }
    var n = (len === "all") ? pool.length : parseInt(len, 10);
    if(!isFinite(n) || n <= 0) n = pool.length;
    var take = Math.min(n, pool.length);
    session = { mode:mode, items:pool.slice(0,take), index:0, correct:0, log:[], current:null };
    show("quiz");
    renderQuestion();
  }

  function altDistractors(item, n){
    var pool = ALT_BANK.filter(function(b){
      return b.type === item.type && b.word !== item.word && b.correct !== item.correct;
    });
    var same = pool.filter(function(b){ return b.word.charAt(0) === item.word.charAt(0); });
    var picked = shuffle(same.slice()).slice(0, n);
    if(picked.length < n){
      var rest = shuffle(pool.filter(function(b){ return picked.indexOf(b) < 0; }));
      picked = picked.concat(rest.slice(0, n - picked.length));
    }
    return picked;
  }

  function renderQuestion(){
    var item = session.items[session.index];
    var alts = [];
    var opts;
    if(item.alt){
      alts = altDistractors(item, 2);
      opts = shuffle([
        { kind:"correct", text:item.correct, word:item.word },
        { kind:"alt", text:alts[0].correct, word:alts[0].word },
        { kind:"alt", text:alts[1].correct, word:alts[1].word }
      ]);
    }else{
      opts = shuffle([
        { kind:"correct", text:item.correct, word:item.word },
        { kind:"near", text:item.near, word:item.nearWord },
        { kind:"opp", text:item.opp, word:item.oppWord }
      ]);
    }
    session.current = { item:item, opts:opts, answered:false, alts:alts };

    $("qWord").textContent = item.word;
    $("qPinyin").textContent = item.pinyin;
    $("qPinyin").hidden = !item.pinyin;
    $("qType").textContent = item.type === 3 ? "短语" : (item.type === 2 ? "成语" : "词语");
    $("counter").textContent = (session.index + 1) + " / " + session.items.length;
    $("progFill").style.width = (session.index / session.items.length * 100) + "%";

    var box = $("options");
    box.innerHTML = "";
    var tags = ["甲","乙","丙"];
    opts.forEach(function(o, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = tags[i];
      var body = document.createElement("span");
      body.className = "opt-body";
      var text = document.createElement("span");
      text.className = "opt-text";
      text.textContent = o.text;
      body.appendChild(text);
      b.appendChild(tag);
      b.appendChild(body);
      b.addEventListener("click", function(){ answer(i); });
      box.appendChild(b);
    });

    var ex = $("explain");
    ex.hidden = true;
    ex.innerHTML = "";
    $("nextBtn").hidden = true;
    $("nextBtn").textContent = (session.index === session.items.length - 1) ? "看结果" : "下一题";

    var card = $("qcard");
    card.classList.remove("enter");
    void card.offsetWidth;
    card.classList.add("enter");
    speak(item.word);
  }

  function answer(i){
    var cur = session.current;
    if(!cur || cur.answered) return;
    cur.answered = true;

    var item = cur.item;
    var picked = cur.opts[i];
    var right = (picked.kind === "correct");
    if(right) session.correct++;

    store.answered++;
    if(right){
      store.correct++;
      delete store.wrong[item.word];
    }else{
      var w = store.wrong[item.word] || { n:0 };
      w.n = (w.n || 0) + 1;
      w.t = Date.now();
      store.wrong[item.word] = w;
    }
    writeStore();
    session.log.push({ item:item, picked:picked.kind });

    var buttons = $("options").querySelectorAll(".opt");
    for(var bi=0; bi<buttons.length; bi++){
      var b = buttons[bi];
      var o = cur.opts[bi];
      b.disabled = true;
      if(o.kind === "correct") b.classList.add("correct");
      else if(bi === i) b.classList.add("wrong");
      else b.classList.add("dim");

      var src = document.createElement("span");
      src.className = "src";
      if(o.kind === "correct") src.textContent = "本词的意思";
      else if(o.kind === "near") src.textContent = "近义词「" + o.word + "」的意思";
      else if(o.kind === "alt") src.textContent = "「" + o.word + "」的意思";
      else src.textContent = "反义词「" + o.word + "」的意思";
      b.querySelector(".opt-body").appendChild(src);
    }

    renderExplain(item, right, cur.alts);
    $("explain").hidden = false;
    $("nextBtn").hidden = false;
    $("progFill").style.width = ((session.index + 1) / session.items.length * 100) + "%";
  }

  function renderExplain(item, right, alts){
    var ex = $("explain");
    ex.innerHTML = "";

    var head = document.createElement("div");
    head.className = "ex-head";
    head.textContent = right ? "选对了" : "再记一遍";
    ex.appendChild(head);

    var rows;
    if(item.alt && alts && alts.length >= 2){
      rows = [
        { cls:"c", label:"本义", word:item.word, mean:item.correct, note:(item.note ? "用法：" + item.note : "") },
        { cls:"n", label:"其他", word:alts[0].word, mean:alts[0].correct, note:"" },
        { cls:"n", label:"其他", word:alts[1].word, mean:alts[1].correct, note:"" }
      ];
    }else{
      rows = [
        { cls:"c", label:"本义", word:item.word, mean:item.correct, note:"" },
        { cls:"n", label:"相近", word:item.nearWord, mean:item.near, note:"辨析：" + item.note },
        { cls:"o", label:"相反", word:item.oppWord, mean:item.opp, note:"" }
      ];
    }

    rows.forEach(function(r){
      var row = document.createElement("div");
      row.className = "exrow " + r.cls;

      var lab = document.createElement("span");
      lab.className = "exlabel";
      lab.textContent = r.label;

      var body = document.createElement("div");
      var st = document.createElement("strong");
      st.textContent = r.word;
      var p = document.createElement("p");
      p.textContent = r.mean;
      body.appendChild(st);
      body.appendChild(p);
      if(r.note){
        var n = document.createElement("p");
        n.className = "note";
        n.textContent = r.note;
        body.appendChild(n);
      }

      row.appendChild(lab);
      row.appendChild(body);
      ex.appendChild(row);
    });
  }

  function next(){
    if(session.index >= session.items.length - 1){ renderResult(); return; }
    session.index++;
    renderQuestion();
  }

  function messageFor(pct){
    if(pct === 100) return "全对。这一组词，你已经分得很清。";
    if(pct >= 80) return "很好。少数近义词还差一点，看下面几个词。";
    if(pct >= 60) return "过了及格线。把没选对的词再看一遍。";
    return "不着急。先把错题的本义读两遍，再练一组。";
  }

  function renderResult(){
    var total = session.items.length;
    var pct = total ? Math.round(session.correct / total * 100) : 0;

    $("rScore").textContent = session.correct + " / " + total;
    $("rMsg").textContent = messageFor(pct);
    $("rPct").textContent = "正确率 " + pct + "%";
    $("rBar").style.width = pct + "%";

    var wrongs = session.log
      .filter(function(l){ return l.picked !== "correct"; })
      .map(function(l){ return l.item; });

    var list = $("rWrongList");
    list.innerHTML = "";
    $("rWrongWrap").hidden = (wrongs.length === 0);
    $("rAllRight").hidden = (wrongs.length !== 0);

    wrongs.forEach(function(it){
      var row = document.createElement("div");
      row.className = "wrow";
      var w = document.createElement("strong");
      w.textContent = it.word;
      var p = document.createElement("p");
      p.textContent = it.correct;
      row.appendChild(w);
      row.appendChild(p);
      list.appendChild(row);
    });

    var wc = wrongCount();
    $("rReviewBtn").hidden = (wc === 0);
    $("rReviewBtn").textContent = "复习错题（" + wc + "）";
    $("rAgainBtn").textContent = (session.mode === "wrong" && wc === 0) ? "再练一组新题" : "再来一组";

    show("result");
  }

  function renderHome(){
    var words = BANK.filter(function(b){ return b.type === 1; }).length;
    var idioms = BANK.filter(function(b){ return b.type === 2; }).length;
    var phrases = BANK.filter(function(b){ return b.type === 3; }).length;
    $("bankCount").textContent = BANK.length;
    $("bankBreak").textContent = "词语 " + words + " · 成语 " + idioms + " · 短语 " + phrases;

    var wc = wrongCount();
    var stats = $("homeStats");
    if(store.answered > 0){
      stats.hidden = false;
      $("stAnswered").textContent = store.answered;
      $("stRate").textContent = Math.round(store.correct / store.answered * 100) + "%";
      $("stWrong").textContent = wc;
      $("wrongBtn").hidden = (wc === 0);
      $("wrongBtn").textContent = "复习错题（" + wc + " 道）";
    }else{
      stats.hidden = true;
      $("wrongBtn").hidden = true;
    }
  }

  function persistSetup(){
    store.setup = { mode:setup.mode, len:setup.len };
    writeStore();
  }

  function initSeg(id, key, allowed, fallback){
    var seg = $(id);
    var saved = store.setup && store.setup[key];
    var value = (saved && allowed.indexOf(saved) >= 0) ? saved : fallback;
    setup[key] = value;

    var buttons = seg.querySelectorAll("button[data-value]");
    Array.prototype.forEach.call(buttons, function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-value") === value));
    });

    seg.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest("button[data-value]") : null;
      if(!b) return;
      setup[key] = b.getAttribute("data-value");
      Array.prototype.forEach.call(buttons, function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
      persistSetup();
    });
  }

  function startFromSetup(){
    start(setup.mode, setup.len);
  }

  $("startBtn").addEventListener("click", startFromSetup);
  $("wrongBtn").addEventListener("click", function(){ start("wrong","all"); });
  $("quitBtn").addEventListener("click", function(){ renderHome(); show("home"); });
  $("nextBtn").addEventListener("click", next);
  $("readBtn").addEventListener("click", function(){
    if(session && session.current) speak(session.current.item.word);
  });
  $("rHomeBtn").addEventListener("click", function(){ renderHome(); show("home"); });
  $("rReviewBtn").addEventListener("click", function(){ start("wrong","all"); });
  $("rAgainBtn").addEventListener("click", function(){
    if(session && session.mode === "wrong" && wrongCount() > 0) start("wrong","all");
    else start(setup.mode, setup.len);
  });

  initSeg("modeSeg","mode",["all","word","idiom","phrase"],"all");
  initSeg("lenSeg","len",["10","20","30","all"],"10");
  renderHome();
  show("home");
})();
</script>
